<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>僕らの会津｜セミイベント入口テスト</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw, calc(100vh * 940 / 1672));height:min(100vh, calc(100vw * 1672 / 940));aspect-ratio:940/1672;overflow:hidden;background:#fff;user-select:none;touch-action:none}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#player{position:absolute;left:0;top:0;height:14%;width:auto;min-height:52px;max-height:210px;transform:translate(-50%,-100%);transform-origin:50% 100%;z-index:10;filter:drop-shadow(0 6px 5px rgba(0,0,0,.24));pointer-events:none;will-change:left,top,transform}
#player::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#222;transform:translate(-50%,-50%)}
#surprisePlayer{position:absolute;left:0;top:0;height:14%;width:auto;min-height:52px;max-height:210px;transform:translate(-50%,-100%);transform-origin:50% 100%;z-index:11;filter:drop-shadow(0 6px 5px rgba(0,0,0,.24));pointer-events:none;will-change:left,top,transform;display:none;}

#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .25s ease}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;background:rgba(255,255,255,.96);border:2px solid #222;border-radius:12px;padding:18px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;min-width:240px}
#message strong{display:block;font-size:22px;margin-bottom:8px}
#message span{font-size:14px}
#hint{position:fixed;left:12px;top:12px;z-index:90;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.4}
#joystick{position:absolute;left:14px;bottom:14px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.30);border:3px solid rgba(0,0,0,.55);z-index:200;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:auto}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(0,0,0,.42);pointer-events:none}
.arrow{position:absolute;z-index:101;width:30px;height:30px;line-height:30px;text-align:center;color:rgba(0,0,0,.72);font-size:20px;font-weight:700;pointer-events:none;text-shadow:0 1px 1px rgba(255,255,255,.6)}
.arrow.up{left:50%;top:5px;transform:translateX(-50%)}.arrow.down{left:50%;bottom:5px;transform:translateX(-50%)}.arrow.left{left:5px;top:50%;transform:translateY(-50%)}.arrow.right{right:5px;top:50%;transform:translateY(-50%)}
@media (max-width:700px){#hint{font-size:11px}}

#cicadaEvent{position:absolute;left:32.81%;top:30.47%;width:9.5%;height:auto;z-index:9;pointer-events:none;display:none;filter:drop-shadow(0 5px 4px rgba(0,0,0,.20));}
#cicadaFlying{position:absolute;left:32.81%;top:30.47%;width:9.5%;height:auto;z-index:10;pointer-events:none;display:none;filter:drop-shadow(0 5px 4px rgba(0,0,0,.20));}
#cicadaFlying.flyAway{animation:cicadaFlyAway 1.25s ease-in forwards;}
@keyframes cicadaFlyAway{0%{left:32.81%;top:30.47%;transform:scale(1) rotate(0deg);opacity:1;}35%{left:55%;top:23%;transform:scale(1.03) rotate(8deg);opacity:1;}70%{left:82%;top:12%;transform:scale(.92) rotate(16deg);opacity:.92;}100%{left:112%;top:3%;transform:scale(.72) rotate(24deg);opacity:0;}}
#eventPrompt{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);z-index:230;width:min(88%,360px);background:rgba(255,255,255,.97);border:2px solid #222;border-radius:14px;padding:14px 14px 12px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.28);display:none;}
#eventPrompt .eventText{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:10px;}
#eventChoices{display:flex;justify-content:center;gap:10px;}
#catchButton,#skipButton{appearance:none;border:2px solid #222;border-radius:10px;background:#fff;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;min-width:96px;touch-action:manipulation;}
#catchButton:active,#skipButton:active{transform:translateY(1px);}
#eventStart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:240;background:rgba(255,255,255,.97);border:2px solid #222;border-radius:14px;padding:20px 26px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;min-width:250px;}
#eventStart strong{display:block;font-size:24px;margin-bottom:7px;}
#eventStart span{font-size:14px;}

#videoEvent{position:absolute;inset:0;z-index:500;background:#000;display:none;align-items:center;justify-content:center;pointer-events:auto;}
#videoEvent video{width:100%;height:100%;object-fit:contain;background:#000;display:block;}
</style></head>
<body><div id="game"><div id="videoEvent"><video id="eventVideo" playsinline muted preload="auto"><source src="C0560_browser.mp4" type="video/mp4"></video></div>
  <img id="bg" alt="テスト道路" src="asset_01.jpg">
  <img id="player" alt="主人公">
  <img id="surprisePlayer" alt="びっくりした主人公" src="asset_02.png">
  <img id="cicadaEvent" alt="草むらに止まっているセミ" src="asset_03.png">
  <img id="cicadaFlying" alt="飛んでいくセミ" src="asset_04.png">
  <div id="eventPrompt" role="dialog" aria-modal="true" aria-label="セミを捕まえる">
    <div class="eventText">セミがいる！</div>
    <div id="eventChoices">
      <button id="catchButton" type="button">捕まえる</button>
      <button id="skipButton" type="button">いらない</button>
    </div>
  </div>
  <div id="eventStart" role="status" aria-live="polite"><strong>虫取りゲーム開始</strong><span>ここから虫取りゲームへ進みます</span></div>

  <div id="joystick" aria-label="移動用ジョイスティック">
    <div class="arrow up">▲</div>
    <div class="arrow down">▼</div>
    <div class="arrow left">◀</div>
    <div class="arrow right">▶</div>
    <div id="stick"></div>
  </div>
  <div id="fade"></div>
</div>
<div id="hint">左下のジョイコンで移動</div><script>const CHAR={front:'asset_05.png',right:'asset_06.png',left:'asset_07.png',rightBack:'asset_08.png',leftBack:'asset_09.png',back:'asset_10.png'};
const WALK={right1:'asset_11.png',right2:'asset_12.png',left1:'asset_13.png',left2:'asset_14.png',leftBack1:'asset_15.png',leftBack2:'asset_16.png',rightBack1:'asset_17.png',rightBack2:'asset_18.png'};

  (() => {
  const W=940, H=1672, COLS=32, ROWS=64;
  const CW=W/COLS, CH=H/ROWS;
  const MAP1_BG='asset_19.jpg';
  const MAP2_BG='asset_20.jpg';
  const MAP3_BG='asset_21.jpg';

  // 一面目：前回OKだった直線テスト
  const map1={
    name:'テスト道路①',
    bg:MAP1_BG,
    green:{c:15,r:9},
    startYellow:{c:15,r:10},
    exitYellow:{c:15,r:57},
    blue:[{c:15,r:58}],
    redCells:new Set(Array.from({length:46},(_,i)=>i+11).flatMap(r=>[14,15,16].map(c=>`${c},${r}`))),
    yellowCells:new Set(['15,10','15,57'])
  };

  // 二面目：既存のS字テスト。ここは変更しない。
  const redRows={
    7:[8,10,11], 8:[8,9,10], 9:[8,10], 10:[8,9,10],
    11:[8,9,10],12:[8,9,10],13:[8,9,10],14:[8,9,10],15:[8,9,10],16:[8,9,10],17:[8,9,10],
    18:[8,9,10,11], 19:[8,9,10,11,12], 20:[9,10,11,12], 21:[10,11,12,13,14],
    22:[11,12,13,14,15], 23:[12,13,14,15,16], 24:[12,13,14,15,16,17],
    25:[13,14,15,16,17,18,19], 26:[15,16,17,18,19,20], 27:[16,17,18,19,20,21],
    28:[18,19,20,21,22], 29:[19,20,21,22], 30:[20,21,22,23], 31:[21,22,23],
    32:[21,22,23,24], 33:[21,22,23,24], 34:[22,23,24],35:[22,23,24],36:[22,23,24],
    37:[22,23,24],38:[22,23,24],39:[22,23,24],40:[22,23,24], 41:[21,22,23],42:[21,22,23],
    43:[20,21,22,23],44:[20,21,22],45:[20,21],46:[19,20,21],47:[19,20,21],48:[18,19,20],
    49:[18,19],50:[17,18,19],51:[16,17,18],52:[16,17,18],53:[17,18],54:[17,18]
  };
  const map2Red=new Set();
  for(const [r,cols] of Object.entries(redRows)) for(const c of cols) map2Red.add(`${c},${r}`);
  const map2={
    name:'テスト道路②（S字）',
    bg:MAP2_BG,
    green:{c:9,r:6},
    startYellow:{c:9,r:7},
    exitYellow:{c:16,r:53},
    blue:[{c:15,r:53},{c:16,r:54},{c:17,r:55}],
    redCells:map2Red,
    yellowCells:new Set(['9,7','16,53'])
  };

  // 三面目：斜め道路。いただいた色付き指示画像のセルをそのまま反映。
  const map3Red=new Set(['25,20','25,21','26,21','29,21','30,21','24,22','25,22','26,22','27,22','28,22','29,22','30,22','24,23','25,23','26,23','27,23','28,23','29,23','23,24','24,24','25,24','26,24','27,24','28,24','29,24','23,25','24,25','25,25','26,25','27,25','28,25','22,26','23,26','24,26','25,26','26,26','27,26','28,26','22,27','23,27','24,27','25,27','26,27','27,27','21,28','22,28','23,28','24,28','25,28','26,28','27,28','21,29','22,29','23,29','24,29','25,29','26,29','20,30','21,30','22,30','23,30','24,30','25,30','26,30','20,31','21,31','22,31','23,31','24,31','25,31','19,32','20,32','21,32','22,32','23,32','24,32','19,33','20,33','21,33','22,33','23,33','24,33','18,34','19,34','20,34','21,34','22,34','23,34','18,35','19,35','20,35','21,35','22,35','23,35','17,36','18,36','19,36','20,36','21,36','22,36','17,37','18,37','19,37','20,37','21,37','22,37','16,38','17,38','18,38','19,38','20,38','21,38','22,38','16,39','17,39','18,39','19,39','20,39','21,39','15,40','16,40','17,40','18,40','19,40','20,40','15,41','16,41','17,41','18,41','19,41','20,41','14,42','15,42','16,42','17,42','18,42','19,42','14,43','15,43','16,43','17,43','18,43','19,43','13,44','14,44','15,44','16,44','17,44','18,44','19,44','13,45','14,45','15,45','16,45','17,45','18,45','12,46','13,46','14,46','15,46','16,46','17,46','18,46','12,47','13,47','14,47','15,47','16,47','17,47','11,48','12,48','13,48','14,48','15,48','16,48','17,48','11,49','12,49','13,49','14,49','15,49','16,49','10,50','11,50','12,50','13,50','14,50','15,50','16,50','9,51','10,51','11,51','12,51','13,51','14,51','15,51','9,52','10,52','11,52','12,52','13,52','14,52','15,52','9,53','10,53','11,53','12,53','13,53','14,53','11,54','12,54','13,54','14,54','12,55','13,55','13,56']);
  const map3={
    name:'三面目',
    bg:MAP3_BG,
    green:{c:27,r:20},
    startYellow:{c:27,r:21},
    exitYellow:null,
    blue:[{c:9,r:54},{c:10,r:54},{c:10,r:55},{c:11,r:55},{c:11,r:56},{c:12,r:56}],
    blueScale:{c:12,r:56},
    redCells:map3Red,
    yellowCells:new Set(['27,21','28,21'])
  };

  const maps=[map1,map2];
  const cellCenter=({c,r})=>({x:(c-.5)*CW,y:(r-.5)*CH});
  const cellAt=(x,y)=>{
    if(x<0||y<0||x>W||y>H) return null;
    return `${Math.floor(x/CW)+1},${Math.floor(y/CH)+1}`;
  };
  const posFor=(m,key)=>cellCenter(m[key]);
  const bluePositions=m=>m.blue.map(cellCenter);
  const nearestBlue=(m)=>{
    if(!m.exitYellow)return bluePositions(m)[0];
    const e=posFor(m,'exitYellow');
    return bluePositions(m).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0];
  };
  const isWalkable=(m,x,y)=>{
    const k=cellAt(x,y);
    return !!k && (m.redCells.has(k)||m.yellowCells.has(k));
  };
  // 緑・青は画像上では今まで通り非表示。
  // 黄色は少し広めの判定として扱い、黄色に入ったら
  // その黄色が「緑側」なら緑へ、「青側」なら青へ「すーっと」移動する。
  const TRIGGER_RADIUS=Math.min(CW,CH)*0.9;
  const isNear=(p,x,y)=>Math.hypot(x-p.x,y-p.y)<TRIGGER_RADIUS;
  const isBlue=(m,x,y)=>m.blue.some(b=>isNear(cellCenter(b),x,y));
  const isEnteringBlue=(m,x,y,nx,ny)=>!isBlue(m,x,y)&&isBlue(m,nx,ny);
  const isYellowCell=(m,x,y)=>{
    const k=cellAt(x,y);
    return !!k && m.yellowCells.has(k);
  };
  const isNearStartYellow=(m,x,y)=>m.startYellow && isNear(posFor(m,'startYellow'),x,y);
  const isNearExitYellow=(m,x,y)=>m.exitYellow && isNear(posFor(m,'exitYellow'),x,y);

  // 三面目だけ、道路の奥行きに合わせてキャラクターを連続的に拡大・縮小する。
  // 切り替えではなく、smoothstepでゆっくり変化させる。
  const clamp01=v=>Math.max(0,Math.min(1,v));
  function updatePlayerScale(){
    if(mapIndex!==2){
      player.style.transform='translate(-50%,-100%)';
      return;
    }
    const farY=posFor(map3,'green').y;
    const nearY=posFor(map3,'blueScale').y;
    const t=clamp01((y-farY)/(nearY-farY));
    const e=t*t*(3-2*t);
    const scale=0.52+(1.36-0.52)*e;
    player.style.transform=`translate(-50%,-100%) scale(${scale.toFixed(4)})`;
  }

  const game=document.getElementById('game');
  const bg=document.getElementById('bg');
  const player=document.getElementById('player');
  const surprisePlayer=document.getElementById('surprisePlayer');
  const fade=document.getElementById('fade');
  const cicadaEvent=document.getElementById('cicadaEvent');
  const cicadaFlying=document.getElementById('cicadaFlying');
  const eventPrompt=document.getElementById('eventPrompt');
  const catchButton=document.getElementById('catchButton');
  const skipButton=document.getElementById('skipButton');
  const eventStart=document.getElementById('eventStart');
  player.src=CHAR.front;

  // 歩行モーション：用意された4方向だけ、歩行中に①⇄②を交互再生。
  let currentDirection='front';
  let walkingActive=false;
  let walkFrame=0;
  let walkStepAt=0;
  const WALK_STEP_MS=180;
  function directionFromInput(dx,dy){
    const ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax<0.15&&ay<0.15)return currentDirection;
    if(ay>ax*1.15){
      if(dy<0)return dx<0?'leftBack':dx>0?'rightBack':'back';
      return 'front';
    }
    if(ax>ay*1.15)return dx>0?'right':'left';
    if(dy<0)return dx<0?'leftBack':dx>0?'rightBack':'back';
    return 'front';
  }
  function standingSrc(dir){
    return CHAR[dir]||CHAR.front;
  }
  function startWalking(dx,dy,now){
    const dir=directionFromInput(dx,dy);
    if(!walkingActive || dir!==currentDirection){
      currentDirection=dir;
      walkingActive=true;
      walkFrame=0;
      walkStepAt=now;
      if(WALK[dir+'1'])player.src=WALK[dir+'1'];
      else player.src=standingSrc(dir);
      return;
    }
    if(WALK[dir+'1'] && now-walkStepAt>=WALK_STEP_MS){
      walkStepAt=now;
      walkFrame=walkFrame?0:1;
      player.src=WALK[dir+(walkFrame+1)];
    }
  }
  function stopWalking(){
    if(!walkingActive)return;
    walkingActive=false;
    walkFrame=0;
    player.src=standingSrc(currentDirection);
  }

  // 虫取りイベント第1段階：一面目の道路端の草むらに止まっているセミ。
  // まずは「近づく→捕まえる？→捕まえる／いらない」までをテストする。
  const cicadaPos=cellCenter({c:11,r:20});
  const CICADA_TRIGGER_RADIUS=95;
  let eventPromptShown=false;
  let eventStarted=false;
  let videoEventPlayed=false;
  const videoEventPos=cellCenter({c:15,r:34});
  const VIDEO_EVENT_RADIUS=58;
  let cicadaGone=false;
  let cicadaFlyingActive=false;
  let surpriseActive=false;
  function updateCicadaEvent(){
    if(cicadaGone || cicadaFlyingActive){
      cicadaEvent.style.display='none';
      if(cicadaFlyingActive) cicadaFlying.style.display='block';
      eventPrompt.style.display='none';
      return;
    }
    const visible=mapIndex===0 && !eventStarted;
    cicadaEvent.style.display=visible?'block':'none';
    if(!visible){
      eventPrompt.style.display='none';
      return;
    }
    const near=Math.hypot(x-cicadaPos.x,y-cicadaPos.y)<=CICADA_TRIGGER_RADIUS;
    if(!near){
      eventPromptShown=false;
      eventPrompt.style.display='none';
      return;
    }
    if(near && state==='free' && !eventPromptShown){
      eventPromptShown=true;
      eventPrompt.style.display='block';
    }
  }
  catchButton.addEventListener('click',()=>{
    eventStarted=true;
    eventPrompt.style.display='none';
    eventStart.style.display='block';
    state='eventStarted';
  });
  function startVideoEvent(){
    if(videoEventPlayed || mapIndex!==0 || state!=='free') return;
    videoEventPlayed=true;
    state='videoEvent';
    stopWalking();
    eventVideo.pause();
    eventVideo.currentTime=0;
    eventVideo.muted=true;
    videoEvent.style.display='flex';
    const p=eventVideo.play();
    if(p && p.catch) p.catch(()=>{});
  }
  eventVideo.addEventListener('ended',()=>{
    eventVideo.pause();
    eventVideo.currentTime=0;
    videoEvent.style.display='none';
    state='free';
  });
  eventVideo.addEventListener('error',()=>{
    videoEvent.style.display='none';
    state='free';
  });
  function updateVideoEvent(){
    if(videoEventPlayed || mapIndex!==0 || state!=='free') return;
    if(Math.hypot(x-videoEventPos.x,y-videoEventPos.y)<=VIDEO_EVENT_RADIUS){
      startVideoEvent();
    }
  }

  skipButton.addEventListener('click',()=>{
    eventPrompt.style.display='none';
    eventPromptShown=false;
    surpriseActive=true;
    player.style.display='none';
    surprisePlayer.style.display='block';
    cicadaGone=true;
    cicadaFlyingActive=true;
    cicadaEvent.style.display='none';
    cicadaFlying.style.display='block';
    cicadaFlying.classList.remove('flyAway');
    requestAnimationFrame(()=>cicadaFlying.classList.add('flyAway'));
    setTimeout(()=>{
      cicadaFlyingActive=false;
      cicadaFlying.style.display='none';
      cicadaFlying.classList.remove('flyAway');
      surpriseActive=false;
      surprisePlayer.style.display='none';
      player.style.display='block';
    },1300);
  });

  let mapIndex=0;
  let m=maps[mapIndex];
  let greenPos=posFor(m,'green');
  let startYellowPos=posFor(m,'startYellow');
  let exitYellowPos=m.exitYellow?posFor(m,'exitYellow'):null;
  let bluePos=nearestBlue(m);
  let x=greenPos.x,y=greenPos.y;
  let state='slideIn';
  let slideFrom={...greenPos}, slideTo={...startYellowPos};
  let slideStart=performance.now();
  const slideDuration=380;
  const speed=210;
  const mapFadeDuration=750;
  let transitionTo=-1, transitionPhase='none', transitionStart=0;
  let transitionToReturn=false;
  let pendingSlideIn=false;
  let pendingReturnSlide=false;
  let exitGuard=false;

  const keys=new Set();
  let jx=0,jy=0,drag=false;
  const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
  function joystickMove(e){
    e.preventDefault();e.stopPropagation();
    const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=43;
    let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
    if(d>max){dx=dx*max/d;dy=dy*max/d;}
    jx=dx/max;jy=dy/max;
    stick.style.left=`calc(50% + ${dx}px)`;stick.style.top=`calc(50% + ${dy}px)`;
  }
  function joystickRelease(e){
    if(e&&e.preventDefault)e.preventDefault();drag=false;jx=jy=0;
    stick.style.left='50%';stick.style.top='50%';
  }
  joy.addEventListener('contextmenu',e=>e.preventDefault());
  joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();drag=true;try{joy.setPointerCapture(e.pointerId)}catch(_){}joystickMove(e);});
  joy.addEventListener('pointermove',e=>{if(drag)joystickMove(e);});
  joy.addEventListener('pointerup',joystickRelease);
  joy.addEventListener('pointercancel',joystickRelease);
  joy.addEventListener('lostpointercapture',joystickRelease);

  function updateDirection(dx,dy){
    currentDirection=directionFromInput(dx,dy);
  }

  function beginSlide(from,to,nextState){
    slideFrom={...from};slideTo={...to};slideStart=performance.now();state=nextState;
  }

  function switchMap(nextIndex, returnToExit=false){
    transitionTo=nextIndex;transitionPhase='fadeOut';transitionStart=performance.now();state='transition';
    fade.style.transition='none';fade.style.opacity='1';
    transitionToReturn=returnToExit;
  }

  function applyMap(nextIndex,returnToExit){
    mapIndex=nextIndex;m=maps[mapIndex];bg.src=m.bg;
    greenPos=posFor(m,'green');startYellowPos=posFor(m,'startYellow');exitYellowPos=m.exitYellow?posFor(m,'exitYellow'):null;bluePos=nearestBlue(m);
    if(returnToExit){
      const bp=bluePos;x=bp.x;y=bp.y;exitGuard=true;pendingSlideIn=false;pendingReturnSlide=true;
    }else{
      x=greenPos.x;y=greenPos.y;exitGuard=false;pendingSlideIn=true;pendingReturnSlide=false;
    }
    state='transition';
  }

  function moveFree(dt){
    let dx=jx,dy=jy;
    if(!dx&&!dy){
      if(keys.has('ArrowLeft')||keys.has('a'))dx-=1;
      if(keys.has('ArrowRight')||keys.has('d'))dx+=1;
      if(keys.has('ArrowUp')||keys.has('w'))dy-=1;
      if(keys.has('ArrowDown')||keys.has('s'))dy+=1;
    }
    if(!dx&&!dy){stopWalking();return;}
    const len=Math.hypot(dx,dy),nx=x+dx/len*speed*dt,ny=y+dy/len*speed*dt;

    // 二面目から一面目へ戻るときだけ、二面目の緑を入口として使う。
    const enteringReturnGreen = mapIndex===1 && !exitGuard && !isNear(greenPos,x,y) && isNear(greenPos,nx,ny);
    if(enteringReturnGreen){
      x=greenPos.x;y=greenPos.y;updateDirection(dx,dy);
      switchMap(0,true);return;
    }

    // 三面目の緑も『← 戻る』地点。青と同じく二面目へ戻る。
    const enteringMap3Green = mapIndex===2 && !isNear(greenPos,x,y) && isNear(greenPos,nx,ny);
    if(enteringMap3Green){
      x=greenPos.x;y=greenPos.y;updateDirection(dx,dy);
      switchMap(1,true);return;
    }

    // 三面目は指示画像に出口側の黄色がないため、青へ入ったらそのまま二面目へ戻る。
    if(mapIndex===2 && isEnteringBlue(m,x,y,nx,ny)){
      const bp=bluePos;x=bp.x;y=bp.y;updateDirection(dx,dy);
      switchMap(1,true);return;
    }

    // 黄色に入ったときだけ「すーっと」。
    // 黄色の場所が緑側なら緑へ、青側なら青へ移動する。
    const enteringYellow=isYellowCell(m,nx,ny) && !isYellowCell(m,x,y);
    if(enteringYellow){
      const sy=posFor(m,'startYellow');
      const ey=exitYellowPos;

      // 黄色は「どちら側から入ったか」で行き先を決める。
      // スタート側の黄色：赤側から入ったら緑へ戻る。
      if(sy && isNear(sy,nx,ny) && !isNear(sy,x,y)){
        if(isWalkable(m,x,y)){
          x=nx;y=ny;updateDirection(dx,dy);
          beginSlide({x,y},greenPos,'slideBack');return;
        }
      }

      // 出口側の黄色：赤側から近づいたら青へ「すーっと」。
      // 二面目のS字道路は黄色セルが赤の端にかかるため、
      // セル境界だけで判定せず、出口黄色の中心から少し広めに判定する。
      if(ey && isWalkable(m,x,y) && Math.hypot(nx-ey.x,ny-ey.y) <= Math.min(CW,CH)*1.35){
        x=nx;y=ny;updateDirection(dx,dy);
        beginSlide({x,y},bluePos,'slideOut');return;
      }
    }

    const wasOnBlue=exitGuard && isBlue(m,x,y);
    let moved=false;
    if(isWalkable(m,nx,y) || wasOnBlue&&isWalkable(m,nx,y)){x=nx;moved=true;}
    if(isWalkable(m,x,ny) || wasOnBlue&&isWalkable(m,x,ny)){y=ny;moved=true;}
    if(moved && !isBlue(m,x,y)) exitGuard=false;
    updateDirection(dx,dy);
    startWalking(dx,dy,performance.now());
  }


  function updateRouteLabel(){ /* 緑・青の案内表示は出さない。 */ }

  let last=performance.now();
  function tick(now){
    const dt=Math.min((now-last)/1000,0.05);last=now;

    if(state!=='free')stopWalking();

    if(state==='transition'){
      const t=Math.min((now-transitionStart)/mapFadeDuration,1);
      if(transitionPhase==='fadeOut' && t>=1){
        applyMap(transitionTo,transitionToReturn);
        transitionPhase='fadeIn';transitionStart=performance.now();fade.style.opacity='1';
      }else if(transitionPhase==='fadeIn'){
        const u=Math.min((now-transitionStart)/mapFadeDuration,1);
        fade.style.opacity=String(1-u);
        if(u>=1){
          fade.style.transition='opacity .25s ease';
          transitionPhase='none';
          if(pendingSlideIn){
            pendingSlideIn=false;
            beginSlide(greenPos,startYellowPos,'slideIn');
          }else if(pendingReturnSlide){
            pendingReturnSlide=false;
            beginSlide(bluePos,exitYellowPos,'slideIn');
          }else{
            state='free';
          }
        }
      }
    }else if(state==='slideIn'||state==='slideOut'){
      const t=Math.min((now-slideStart)/slideDuration,1),e=t*t*(3-2*t);
      x=slideFrom.x+(slideTo.x-slideFrom.x)*e;y=slideFrom.y+(slideTo.y-slideFrom.y)*e;
      if(t>=1){
        if(state==='slideIn') state='free';
        else if(state==='slideOut'){
          // 黄色→青。青に着いたら次の面へ。
          const next=mapIndex===0?1:0;
          switchMap(next,mapIndex===2);
        }else if(state==='slideBack'){
          // 黄色→緑。緑に着いたら前の面へ。
          if(mapIndex>0) switchMap(mapIndex-1,true);
          else state='free';
        }
      }
    }else if(state==='free') moveFree(dt);

    updateVideoEvent();
    updateCicadaEvent();
    // 歩行中は startWalking() が歩行①②を切り替える。
    // ここで立ち絵を毎フレーム上書きしない。
  player.style.left=(x/W*100)+'%';player.style.top=(y/H*100)+'%';
    surprisePlayer.style.left=(x/W*100)+'%';surprisePlayer.style.top=(y/H*100)+'%';
    updatePlayerScale();
    surprisePlayer.style.transform=player.style.transform;
    updateRouteLabel();
    requestAnimationFrame(tick);
  }

  function keyName(e){
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return e.key;
    const k=e.key.toLowerCase();return ['w','a','s','d'].includes(k)?k:null;
  }
  addEventListener('keydown',e=>{const k=keyName(e);if(!k)return;e.preventDefault();if(state==='free')keys.add(k);},{passive:false});
  addEventListener('keyup',e=>{const k=keyName(e);if(!k)return;e.preventDefault();keys.delete(k);},{passive:false});

  player.style.left=(x/W*100)+'%';player.style.top=(y/H*100)+'%';
  surprisePlayer.style.left=(x/W*100)+'%';surprisePlayer.style.top=(y/H*100)+'%';
  updatePlayerScale();
  surprisePlayer.style.transform=player.style.transform;
  requestAnimationFrame(tick);
})();</script></body></html>
